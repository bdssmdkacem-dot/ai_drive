name: ai_drive
description: "AI Drive Assistant - on-device ADAS, dashcam and driving companion"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.5.1

  # Camera & Media
  camera: ^0.10.6
  video_player: ^2.9.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # Google ML Kit
  google_mlkit_object_detection: ^0.13.0
  google_mlkit_face_detection: ^0.10.0
  google_mlkit_commons: ^0.7.1

  # Sensors
  sensors_plus: ^5.0.1

  # GPS & Maps
  geolocator: ^12.0.0
  google_maps_flutter: ^2.7.0

  # Voice
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2
  url_launcher: ^6.3.0

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Notifications
  flutter_local_notifications: ^17.2.1+2

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  share_plus: ^9.0.0
  wakelock_plus: ^1.2.5
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
