name: ai_drive
description: "AI Drive Assistant - on-device ADAS, dashcam and driving companion"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  camera: ^0.11.2+1
  video_player: ^2.10.0
  path_provider: ^2.1.5
  path: ^1.9.1
  google_mlkit_object_detection: ^0.15.0
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_commons: ^0.11.0
  sensors_plus: ^6.1.1
  geolocator: ^13.0.4
  google_maps_flutter: ^2.12.3
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  url_launcher: ^6.3.2

  # Isar 3.1.0+1 is the last stable upstream Isar release.
  # xxf_isar_flutter_libs provides the Android namespace fix required by
  # modern Android Gradle Plugin versions.
  isar: ^3.1.0+1
  xxf_isar_flutter_libs: ^3.1.0+3

  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^19.4.0
  permission_handler: ^12.0.1
  intl: ^0.20.2
  share_plus: ^12.0.2
  wakelock_plus: ^1.4.0
  device_info_plus: ^11.5.0
  connectivity_plus: ^6.1.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.4.13
  isar_generator: 3.1.0+1

flutter:
  uses-material-design: true
