name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

concurrency:
  group: ai-drive-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY_RELEASE || vars.MAPS_API_KEY_RELEASE || secrets.MAPS_API_KEY || vars.MAPS_API_KEY }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          if [ -z "$MAPS_API_KEY" ]; then
            echo "ERROR: Google Maps API key is missing."
            echo "Set repository Actions variable MAPS_API_KEY_RELEASE or MAPS_API_KEY."
            exit 1
          fi
          printf 'maps.apiKey=%s\n' "$MAPS_API_KEY" >> android/local.properties
          echo "Google Maps API key configured for Android release build."

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Isar
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode Upload Keystore
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build Release App Bundle
        run: flutter build appbundle --release

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ai-drive-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

